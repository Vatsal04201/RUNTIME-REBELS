<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClubOps AI — Event Planner</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .phase-column {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .phase-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .task-card {
      background: rgba(10, 14, 26, 0.7);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s;
    }
    .task-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }
    .task-card.done {
      opacity: 0.6;
      text-decoration: line-through;
    }
    .task-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: var(--text-2);
    }
  </style>
</head>
<body data-page="planner">

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div class="page-title">
          <h1><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--cyan);"></i> AI 3-Phase Event Planner <span class="badge-ai">Gemini AI</span></h1>
          <p>Operational execution plan for <strong id="plannerEventName">Loading...</strong>. Live AI lifecycle roadmap.</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost" onclick="generateAiPlan()"><i class="fa-solid fa-sparkles" style="color:var(--cyan);"></i> Regenerate with Gemini</button>
          <button class="btn btn-primary" onclick="openAddTaskModal()"><i class="fa-solid fa-plus"></i> Add Task</button>
        </div>
      </header>

      <!-- Event Selector Bar -->
      <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); border:1px solid var(--border); padding:12px 18px; border-radius:12px; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <i class="fa-solid fa-calendar-check" style="color:var(--cyan); font-size:18px;"></i>
          <label for="plannerEventSelect" style="font-size:13px; color:var(--text-1); font-weight:600;">Active Event Plan:</label>
          <select id="plannerEventSelect" style="background:var(--bg-card-2); color:var(--text-0); border:1px solid var(--border-strong); padding:7px 14px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; min-width:260px;"></select>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span id="plannerEventMeta" style="font-size:12.5px; color:var(--text-2);"></span>
          <button class="btn btn-ghost btn-sm" onclick="generateAiPlan()"><i class="fa-solid fa-brain" style="color:var(--cyan);"></i> Regenerate Tasks with Gemini AI</button>
        </div>
      </div>

      <!-- 3 Columns for Phases -->
      <div class="grid grid-3">
        <!-- Phase 1: Before Event -->
        <div class="phase-column">
          <div class="phase-head">
            <div>
              <h3 style="display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-clipboard-check" style="color:var(--cyan);"></i> 1. Before Event</h3>
              <span class="card-sub">Approvals, bookings & preparation</span>
            </div>
            <span class="badge badge-cyan" id="badgeBeforeCount">0 tasks</span>
          </div>
          <div id="colBeforeTasks" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <!-- Phase 2: Event Day -->
        <div class="phase-column">
          <div class="phase-head">
            <div>
              <h3 style="display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-satellite-dish" style="color:var(--amber);"></i> 2. Event Day</h3>
              <span class="card-sub">Live coordination & stage execution</span>
            </div>
            <span class="badge badge-amber" id="badgeDayCount">0 tasks</span>
          </div>
          <div id="colDayTasks" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <!-- Phase 3: After Event -->
        <div class="phase-column">
          <div class="phase-head">
            <div>
              <h3 style="display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-flag-checkered" style="color:var(--green);"></i> 3. After Event</h3>
              <span class="card-sub">Feedback, clean-up & vendor settlement</span>
            </div>
            <span class="badge badge-green" id="badgeAfterCount">0 tasks</span>
          </div>
          <div id="colAfterTasks" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="shared.js"></script>
  <script>
    let currentEventId = '';
    let currentEvent = null;
    let allTasks = [];

    async function initPlanner() {
      await ClubOps.loadEventSelector('plannerEventSelect', (eventId, ev) => {
        currentEventId = eventId;
        currentEvent = ev;
        if (ev) {
          document.getElementById('plannerEventName').textContent = ev.name;
          const metaEl = document.getElementById('plannerEventMeta');
          if (metaEl) {
            metaEl.innerHTML = `<i class="fa-solid fa-location-dot"></i> ${ClubOps.escapeHtml(ev.venue || 'Venue')} &bull; <i class="fa-solid fa-calendar"></i> ${ClubOps.escapeHtml(ev.date || 'TBD')}`;
          }
        }
        loadPlannerTasks(currentEventId);
      });
    }

    async function loadPlannerTasks(eventId) {
      if (!eventId) eventId = currentEventId || ClubOps.getActiveEventId();
      if (!eventId) return;

      try {
        const res = await ClubOps.api.get(`/api/tasks?eventId=${eventId}`);
        allTasks = res.data || [];
        renderPhases();
      } catch (e) {
        console.error(e);
        ClubOps.toast('Error loading tasks from database', 'error');
      }
    }

    function renderPhases() {
      const before = allTasks.filter(t => t.phase === 'Before Event');
      const day = allTasks.filter(t => t.phase === 'Event Day');
      const after = allTasks.filter(t => t.phase === 'After Event');

      document.getElementById('badgeBeforeCount').textContent = `${before.length} tasks`;
      document.getElementById('badgeDayCount').textContent = `${day.length} tasks`;
      document.getElementById('badgeAfterCount').textContent = `${after.length} tasks`;

      renderTaskColumn('colBeforeTasks', before, 'Before Event');
      renderTaskColumn('colDayTasks', day, 'Event Day');
      renderTaskColumn('colAfterTasks', after, 'After Event');
    }

    function renderTaskColumn(containerId, tasks, phaseName) {
      const container = document.getElementById(containerId);
      if (!container) return;

      if (tasks.length === 0) {
        container.innerHTML = `
          <div style="color:var(--text-3); font-size:12.5px; padding:24px 16px; text-align:center; border:1px dashed var(--border); border-radius:10px;">
            <i class="fa-solid fa-list-check" style="font-size:20px; opacity:0.4; margin-bottom:8px; display:block;"></i>
            No tasks in ${phaseName}.
            <div style="margin-top:10px;">
              <button class="btn btn-ghost btn-xs" onclick="generateAiPlan()"><i class="fa-solid fa-sparkles"></i> Generate with Gemini</button>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = tasks.map(t => {
        const isDone = t.status.toLowerCase() === 'completed';
        const priorityColor = t.priority === 'High' ? 'badge-red' : (t.priority === 'Medium' ? 'badge-amber' : 'badge-cyan');

        return `
          <div class="task-card ${isDone ? 'done' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
              <strong style="font-size:13px; color:var(--text-0);">${ClubOps.escapeHtml(t.title)}</strong>
              <button onclick="toggleTask('${t.id}', '${isDone ? 'Pending' : 'Completed'}')" style="color:${isDone ? 'var(--green)' : 'var(--text-3)'}; font-size:16px; cursor:pointer; background:none; border:none;">
                <i class="fa-${isDone ? 'solid fa-circle-check' : 'regular fa-circle'}"></i>
              </button>
            </div>
            <div class="task-meta">
              <span><i class="fa-solid fa-user"></i> ${ClubOps.escapeHtml(t.owner)}</span>
              <span><i class="fa-solid fa-clock"></i> ${ClubOps.escapeHtml(t.deadline)}</span>
              <span class="badge ${priorityColor}">${ClubOps.escapeHtml(t.priority)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleTask(id, nextStatus) {
      try {
        await ClubOps.api.put(`/api/tasks/${id}`, { status: nextStatus });
        ClubOps.toast(`Task marked ${nextStatus}!`, 'success');
        loadPlannerTasks(currentEventId);
      } catch (e) {
        ClubOps.toast('Failed to update task', 'error');
      }
    }

    function openAddTaskModal() {
      const body = `
        <div class="form-grid">
          <div class="field full">
            <label>Task Title</label>
            <input type="text" id="modalTaskTitle" placeholder="e.g. Inspect fire extinguishers" required>
          </div>
          <div class="field">
            <label>Assigned Lead</label>
            <input type="text" id="modalTaskOwner" value="Organizing Committee">
          </div>
          <div class="field">
            <label>Operational Phase</label>
            <select id="modalTaskPhase">
              <option value="Before Event">1. Before Event</option>
              <option value="Event Day">2. Event Day</option>
              <option value="After Event">3. After Event</option>
            </select>
          </div>
          <div class="field">
            <label>Priority</label>
            <select id="modalTaskPriority">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div class="field">
            <label>Deadline</label>
            <input type="text" id="modalTaskDeadline" value="Tomorrow">
          </div>
        </div>
      `;

      ClubOps.modal.open({
        title: 'Add New Operational Task',
        body,
        actions: [
          { label: 'Cancel', className: 'btn-ghost', onClick: () => ClubOps.modal.close() },
          {
            label: 'Save Task',
            className: 'btn-primary',
            icon: 'fa-check',
            onClick: async () => {
              const title = document.getElementById('modalTaskTitle').value;
              const owner = document.getElementById('modalTaskOwner').value;
              const phase = document.getElementById('modalTaskPhase').value;
              const priority = document.getElementById('modalTaskPriority').value;
              const deadline = document.getElementById('modalTaskDeadline').value;

              if (!title) return;
              await ClubOps.api.post('/api/tasks', {
                eventId: currentEventId, title, owner, phase, priority, deadline, status: 'Pending'
              });
              ClubOps.toast('Task created successfully!', 'success');
              loadPlannerTasks(currentEventId);
            }
          }
        ]
      });
    }

    async function generateAiPlan() {
      const evName = currentEvent?.name || 'Current Event';
      ClubOps.aiLoader.show([
        `Extracting ${evName} description and special requirements...`,
        'Analyzing venue logistics and designated department leads...',
        'Synthesizing custom 3-phase tasks with Google Gemini AI...',
        'Updating database and refreshing board...'
      ]);

      try {
        const res = await ClubOps.api.post(`/api/events/${currentEventId}/ai-plan`);
        ClubOps.aiLoader.hide();
        if (res.success) {
          ClubOps.toast(`Gemini AI generated ${res.tasks.length} dynamic tasks!`, 'success');
          allTasks = res.tasks;
          renderPhases();
        } else {
          ClubOps.toast(res.message || 'Could not generate plan', 'error');
        }
      } catch (e) {
        ClubOps.aiLoader.hide();
        ClubOps.toast('Error generating plan with Gemini: ' + e.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', initPlanner);
  </script>
</body>
</html>
